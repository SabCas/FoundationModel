<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="740" viewBox="0 0 1920 740" role="img" aria-labelledby="title desc">
  <title id="title">KUBECA Fragile Control Loop</title>
  <desc id="desc">A clean aerospace-style infographic showing drones, live video, GPS, RF link, and mission data flowing into one operator, then manual control and live interpretation, resulting in delayed decisions, lost context, and human exposure.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .black { stroke: #080b0f; }
      .muted { stroke: #9aa1aa; }
      .light { stroke: #d8dde4; }
      .blue { stroke: #6f747b; }
      .blueFill { fill: #6f747b; }
      .text { fill: #080b0f; font-family: Arial, Helvetica, sans-serif; }
      .mutedText { fill: #5f6670; font-family: Arial, Helvetica, sans-serif; }
      .blueText { fill: #6f747b; font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 28px; font-weight: 800; letter-spacing: 8px; }
      .label { font-size: 20px; font-weight: 800; letter-spacing: 4px; }
      .small { font-size: 18px; font-weight: 400; letter-spacing: .2px; }
      .boxTitle { font-size: 24px; font-weight: 800; letter-spacing: 4px; }
      .boxSub { font-size: 20px; font-weight: 400; letter-spacing: .3px; }
      .dash { stroke-dasharray: 8 8; }
      .round { stroke-linecap: round; stroke-linejoin: round; }
    </style>

    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f747b"/>
    </marker>

    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa1aa"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1920" height="620"/>

  <!-- Title -->
  <text x="960" y="58" text-anchor="middle" class="blueText title">THE FRAGILE CONTROL LOOP</text>

  <!-- Top input lanes -->
  <g transform="translate(0,0)">
    <!-- vertical separators -->
    <line x1="460" y1="118" x2="460" y2="250" class="light" stroke-width="2"/>
    <line x1="780" y1="118" x2="780" y2="250" class="light" stroke-width="2"/>
    <line x1="1100" y1="118" x2="1100" y2="250" class="light" stroke-width="2"/>
    <line x1="1420" y1="118" x2="1420" y2="250" class="light" stroke-width="2"/>

    <!-- DRONES icon -->
    <g transform="translate(210,125)" class="black round" stroke-width="3" fill="none">
      <line x1="10" y1="38" x2="90" y2="38"/>
      <line x1="50" y1="14" x2="50" y2="70"/>
      <rect x="36" y="28" width="28" height="20" rx="3" fill="#080b0f" stroke="none"/>
      <line x1="16" y1="22" x2="16" y2="54"/>
      <line x1="84" y1="22" x2="84" y2="54"/>
      <ellipse cx="16" cy="20" rx="22" ry="4"/>
      <ellipse cx="84" cy="20" rx="22" ry="4"/>
      <ellipse cx="16" cy="56" rx="22" ry="4"/>
      <ellipse cx="84" cy="56" rx="22" ry="4"/>
      <line x1="44" y1="48" x2="36" y2="66"/>
      <line x1="56" y1="48" x2="64" y2="66"/>
    </g>
    <text x="260" y="204" text-anchor="middle" class="text label">DRONES</text>
    <text x="260" y="242" text-anchor="middle" class="text small">Multiple assets</text>

    <!-- LIVE VIDEO icon -->
    <g transform="translate(563,126)" class="black round" stroke-width="3" fill="none">
      <rect x="0" y="0" width="84" height="58" rx="3"/>
      <path d="M34 15 L56 29 L34 43 Z"/>
    </g>
    <text x="605" y="204" text-anchor="middle" class="text label">LIVE VIDEO</text>
    <text x="605" y="242" text-anchor="middle" class="text small">High data volume</text>

    <!-- GPS icon -->
    <g transform="translate(895,118)" class="black round" stroke-width="3" fill="none">
      <path d="M40 0 C18 0 0 17 0 39 C0 70 40 104 40 104 C40 104 80 70 80 39 C80 17 62 0 40 0 Z"/>
      <circle cx="40" cy="39" r="11"/>
    </g>
    <text x="935" y="204" text-anchor="middle" class="text label">GPS</text>
    <text x="935" y="242" text-anchor="middle" class="text small">Position data</text>

    <!-- RF LINK icon -->
    <g transform="translate(1220,118)" class="black round" stroke-width="3" fill="none">
      <path d="M40 92 L40 38"/>
      <path d="M22 92 L58 92"/>
      <path d="M28 38 L52 38 L40 16 Z"/>
      <path d="M23 25 C13 35 13 50 23 60"/>
      <path d="M57 25 C67 35 67 50 57 60"/>
      <path d="M12 12 C-4 30 -4 55 12 74"/>
      <path d="M68 12 C84 30 84 55 68 74"/>
    </g>
    <text x="1260" y="204" text-anchor="middle" class="text label">RF LINK</text>
    <text x="1260" y="242" text-anchor="middle" class="text small">Connectivity</text>

    <!-- MISSION DATA icon -->
    <g transform="translate(1540,125)" class="black round" stroke-width="3" fill="none">
      <path d="M0 20 L50 0 L100 20 L50 40 Z"/>
      <path d="M0 45 L50 25 L100 45 L50 65 Z"/>
      <path d="M0 70 L50 50 L100 70 L50 90 Z"/>
    </g>
    <text x="1590" y="204" text-anchor="middle" class="text label">MISSION DATA</text>
    <text x="1590" y="242" text-anchor="middle" class="text small">Maps, intel, updates</text>
  </g>

  <!-- Dashed funnel lines into operator -->
  <g class="muted dash round" stroke-width="2" fill="none">
    <path d="M260 278 L260 316 Q260 335 282 338 L960 402"/>
    <path d="M605 278 L605 318 Q605 336 628 338 L960 402"/>
    <path d="M935 278 L935 350 L960 402"/>
    <path d="M1260 278 L1260 318 Q1260 336 1238 338 L960 402"/>
    <path d="M1590 278 L1590 316 Q1590 335 1568 338 L960 402"/>
  </g>

  <!-- Operator box -->
  <line x1="960" y1="370" x2="960" y2="410" class="blue" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <g transform="translate(690,410)">
    <rect x="0" y="0" width="540" height="80" fill="none" stroke="#080b0f" stroke-width="1.5"/>
    <g transform="translate(72,18)" class="black round" stroke-width="2.5" fill="none">
      <circle cx="22" cy="16" r="13"/>
      <path d="M0 52 C3 32 14 25 22 25 C30 25 41 32 44 52 Z"/>
    </g>
    <text x="185" y="34" class="text boxTitle">ONE OPERATOR</text>
    <text x="185" y="63" class="text boxSub">Human bottleneck</text>
  </g>

  <!-- Manual control box -->
  <line x1="960" y1="490" x2="960" y2="530" class="blue" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <g transform="translate(585,530)">
    <rect x="0" y="0" width="750" height="94" fill="none" stroke="#080b0f" stroke-width="1.5"/>
    <g transform="translate(92,22)" class="black round" stroke-width="2.5" fill="none">
      <path d="M28 3 C12 3 3 16 3 29 C3 42 12 55 28 55"/>
      <path d="M28 3 C44 3 53 16 53 29 C53 42 44 55 28 55"/>
      <path d="M28 3 V55"/>
      <path d="M15 14 C21 18 21 24 15 28"/>
      <path d="M41 14 C35 18 35 24 41 28"/>
      <path d="M15 43 C21 38 21 34 15 31"/>
      <path d="M41 43 C35 38 35 34 41 31"/>
    </g>
    <text x="245" y="39" class="text boxTitle">MANUAL CONTROL</text>
    <text x="245" y="70" class="text boxTitle">+ LIVE INTERPRETATION</text>
    <text x="245" y="98" class="text boxSub" transform="translate(0,-4)">Piloting, watching, remembering, deciding</text>
  </g>


  <!-- Result box -->
  <line x1="960" y1="624" x2="960" y2="660" class="blue" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <g transform="translate(480,660)">
    <rect x="0" y="0" width="960" height="86" fill="none" stroke="#080b0f" stroke-width="1.5"/>
    <g transform="translate(50,21)" class="black round" stroke-width="2.5" fill="none">
      <circle cx="28" cy="28" r="28"/>
      <path d="M28 10 V30 L43 40"/>
    </g>
    <text x="180" y="36" class="text boxTitle">DELAYED DECISIONS / LOST CONTEXT / HUMAN EXPOSURE</text>
    <text x="180" y="66" class="text boxSub">Slower response, information loss, increased risk</text>
  </g>

</svg>
