<!doctype html>
<html><head><meta charset="utf-8"><title>KUBECA SVG Assets</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:40px;color:#080b0f}
section{background:white;padding:28px;margin:0 auto 32px;max-width:1200px}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:24px;text-align:center}
.icons img{width:64px;height:64px}.icons span{display:block;margin-top:10px;font-size:12px;letter-spacing:1px}
.graphic img{width:100%;height:auto}
</style></head><body>
<section><h2>Icons</h2><div class="icons">
<div><img src="icons/drones.svg"><span>drones.svg</span></div>
<div><img src="icons/live_video.svg"><span>live_video.svg</span></div>
<div><img src="icons/gps.svg"><span>gps.svg</span></div>
<div><img src="icons/rf_link.svg"><span>rf_link.svg</span></div>
<div><img src="icons/mission_data.svg"><span>mission_data.svg</span></div>
<div><img src="icons/operator.svg"><span>operator.svg</span></div>
<div><img src="icons/manual_control.svg"><span>manual_control.svg</span></div>
<div><img src="icons/delayed_decisions.svg"><span>delayed_decisions.svg</span></div>
</div></section>
<section class="graphic"><h2>Control loop graphic</h2><img src="graphics/control_loop_graphic.svg"></section>
</body></html>
